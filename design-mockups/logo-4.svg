<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 248" role="img" aria-label="BREAK — The Regular logo">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fugaz+One&amp;display=swap');
    .script { font-family: 'Fugaz One', 'Arial Black', sans-serif; }
    .caps { font-family: 'Fugaz One', 'Arial Black', sans-serif; }
  </style>
  <defs>
    <pattern id="check4" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#221F1A"/>
      <rect x="14" y="14" width="14" height="14" fill="#221F1A"/>
      <rect x="14" width="14" height="14" fill="#FFF4DF"/>
      <rect y="14" width="14" height="14" fill="#FFF4DF"/>
    </pattern>
  </defs>
  <!-- starburst ticks -->
  <circle cx="180" cy="106" r="100" fill="none" stroke="#F2B33D" stroke-width="24" stroke-dasharray="9 17"/>
  <!-- badge -->
  <ellipse cx="180" cy="106" rx="156" ry="88" fill="#221F1A"/>
  <ellipse cx="180" cy="106" rx="148" ry="80" fill="#D62F2F"/>
  <ellipse cx="180" cy="106" rx="136" ry="69" fill="none" stroke="#FFF4DF" stroke-width="4" stroke-dasharray="1 9" stroke-linecap="round"/>
  <text class="script" x="180" y="124" font-size="68" text-anchor="middle" fill="#FFF4DF" transform="rotate(-4 180 106)">Break!</text>
  <text class="caps" x="180" y="158" font-size="13" text-anchor="middle" fill="#FFE9C2" letter-spacing="4">ORDER AHEAD · NO LINE</text>
  <!-- checker counter strip -->
  <rect x="110" y="204" width="140" height="28" fill="url(#check4)" stroke="#221F1A" stroke-width="4"/>
</svg>
