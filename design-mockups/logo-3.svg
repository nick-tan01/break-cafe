<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" role="img" aria-label="BREAK — Cloud Cover logo">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@800&amp;display=swap');
    text { font-family: 'Manrope', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
  </style>
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FBFA6"/>
      <stop offset="1" stop-color="#A9C6E8"/>
    </linearGradient>
  </defs>
  <!-- Mark: the universal pause symbol — press pause, take a break -->
  <rect x="16" y="20" width="140" height="140" rx="44" fill="url(#g3)"/>
  <rect x="63" y="58" width="19" height="64" rx="9.5" fill="#FFFFFF"/>
  <rect x="92" y="58" width="19" height="64" rx="9.5" fill="#FFFFFF"/>
  <!-- Wordmark -->
  <text x="192" y="118" font-size="84" letter-spacing="-2">
    <tspan fill="#232B3A">break</tspan><tspan fill="#6FA287">.</tspan>
  </text>
</svg>
